name: Refresh Dashboard Data

on:
  schedule:
    # Runs every day at 10:00 AM IST (04:30 UTC)
    - cron: '30 4 * * *'
  workflow_dispatch:

concurrency:
  group: refresh-dashboard
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pandas numpy pytz

      - name: Fetch data and rebuild data.json
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
        run: python scripts/rebuild_dashboard.py

      - name: Commit and push updated data.json
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data.json
          git commit -m "Auto-refresh data: $(date +'%d %b %Y %H:%M UTC')" || echo "No changes to commit"
          git fetch origin main
          git rebase origin/main
          git push origin main

      # ── Slack notification on SUCCESS ──────────────────────────────────────
      - name: Notify Slack — Success
        if: success()
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -X POST "$SLACK_WEBHOOK" \
            -H 'Content-type: application/json' \
            --data '{
              "text": "✅ *Fortification Dashboard updated successfully*\nData refreshed at '"$(date +'%d %b %Y %H:%M UTC')"' · <https://fortify-health.github.io/Fortification_Dashboard/|Open Dashboard>"
            }'

      # ── Slack notification on FAILURE ──────────────────────────────────────
      - name: Notify Slack — Failure
        if: failure()
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -X POST "$SLACK_WEBHOOK" \
            -H 'Content-type: application/json' \
            --data '{
              "text": "❌ *Fortification Dashboard update FAILED*\nThe daily data refresh did not complete. <https://github.com/fortify-health/Fortification_Dashboard/actions|Check the Actions log> for details."
            }'
